name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  # Actions 탭의 "Run workflow" 버튼. 시트를 고친 뒤 이걸 누르면 사이트가 갱신된다.
  workflow_dispatch:
  # 구글 시트의 "사이트 업데이트" 메뉴가 보내는 신호.
  repository_dispatch:
    types: [update-content]
  # 버튼 누르는 것을 잊어도 하루 두 번은 시트 내용을 따라가도록.
  schedule:
    - cron: "0 0,12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹칠 때 가장 마지막 것만 반영한다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        env:
          # 저장소 Settings > Secrets and variables > Actions > Variables 에 등록.
          # 비어 있으면 저장소에 있는 content.json 으로 빌드된다.
          SHEET_ID: ${{ vars.SHEET_ID }}
        # username.github.io 저장소가 아니면 /저장소이름 을 base path로 붙인다.
        # SITE_URL 은 카톡 공유 미리보기용 절대 주소를 만드는 데 쓴다.
        # 자체 도메인을 쓴다면 저장소 Variables 에 SITE_URL 을 등록하면 그 값이 우선한다.
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            BASE_PATH=""
          else
            BASE_PATH="/${{ github.event.repository.name }}"
          fi
          SITE_URL="${{ vars.SITE_URL }}"
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://${{ github.repository_owner }}.github.io${BASE_PATH}"
          fi
          echo "BASE_PATH=$BASE_PATH / SITE_URL=$SITE_URL"
          BASE_PATH="$BASE_PATH" SITE_URL="$SITE_URL" npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.try1.outputs.page_url || steps.try2.outputs.page_url || steps.try3.outputs.page_url }}
    steps:
      # GitHub 의 Pages 배포 API 가 가끔 실패한다. 우리 쪽 문제가 아니고 대개 곧
      # 풀리므로 사람이 다시 누르지 않아도 되게 스스로 다시 시도한다.
      # 30초 뒤 한 번만 더 해 보는 것으로는 모자랐던 적이 있어 간격을 벌려 세 번 시도한다.
      # 앞이 성공하면 뒤는 건너뛰므로 평소에는 시간이 더 걸리지 않는다.
      - id: try1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.try1.outcome == 'failure'
        run: |
          echo "Pages 배포가 실패했습니다. 1분 뒤 다시 시도합니다."
          sleep 60

      - id: try2
        if: steps.try1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.try2.outcome == 'failure'
        run: |
          echo "두 번째도 실패했습니다. 3분 뒤 마지막으로 시도합니다."
          sleep 180

      # 마지막 시도는 continue-on-error 를 두지 않는다. 여기까지 실패하면
      # 정말로 배포가 안 된 것이라 워크플로가 빨간불로 알려 주어야 한다.
      - id: try3
        if: steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v4
